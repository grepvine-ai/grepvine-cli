version: 2
updates:
  - package-ecosystem: gomod
    # The tools have their own modules so their dependencies stay out of gv.
    directories: ["/", "/tools/*"]
    schedule:
      interval: weekly
    groups:
      gomod:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
