name: CI

on:
  pull_request:
  push:
    branches: [main]
    # A snapshot commit is checked by regenerate.yml, which commits the
    # regenerated client right after it.
    paths-ignore: ["spec/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-26.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          # gitleaks scans every commit, not only the tip.
          fetch-depth: 0

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Check public wording
        run: scripts/check-public.sh

      - name: Scan for secrets
        run: go tool -modfile=tools/gitleaks/go.mod gitleaks git --redact --no-banner .

      - name: Check generated code
        run: make verify-generated

      - name: Run linters
        run: make lint

      - name: Run tests with the race detector
        run: make test-race

      - name: Build
        run: make build

      - name: Check the release configuration
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: check

      - name: Build every release target
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: build --snapshot --clean
