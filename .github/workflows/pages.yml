name: Publish the install script

# Serves install.sh with GitHub Pages, so `curl -fsSL <site>/install.sh | sh`
# installs the latest release.
on:
  push:
    branches: [main]
    paths:
      - install.sh
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-26.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}install.sh
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Check the script
        run: sh -n install.sh

      - name: Build the site
        run: |
          mkdir site
          cp install.sh site/install.sh

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy the site
        id: deploy
        uses: actions/deploy-pages@v5
