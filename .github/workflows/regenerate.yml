name: Regenerate the API client

# Grepvine's "Update API client snapshots" workflow commits a new spec/ snapshot to
# main and then dispatches this workflow with that commit.
on:
  workflow_dispatch:
    inputs:
      snapshot_commit:
        description: Snapshot commit pushed by Grepvine (empty uses current main)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: regenerate
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-26.04
    steps:
      # The treeverse-ci-bot app is exempt from main's protection rules; the
      # built-in GITHUB_TOKEN cannot push to main.
      - name: Create a GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CI_BOT_CLIENT_ID }}
          private-key: ${{ secrets.CI_BOT_PRIVATE_KEY }}

      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Check the requested snapshot is still current
        if: inputs.snapshot_commit != ''
        env:
          SNAPSHOT_COMMIT: ${{ inputs.snapshot_commit }}
        run: |
          [[ "$SNAPSHOT_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          git diff --exit-code "$SNAPSHOT_COMMIT" HEAD -- spec

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Regenerate the API client
        run: make generate

      - name: Run linters
        run: make lint

      - name: Run tests with the race detector
        run: make test-race

      - name: Build
        run: make build

      - name: Commit the regenerated client
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BOT: ${{ steps.app-token.outputs.app-slug }}[bot]
        run: |
          git config user.name "$BOT"
          git config user.email "$(gh api "/users/$BOT" -q .id)+$BOT@users.noreply.github.com"
          git add internal/httpapi
          if ! git diff --cached --quiet; then
            source_commit=$(jq -r .commit spec/source.json)
            git commit -m "Generate the API client from Grepvine $source_commit"
            git push origin HEAD:main
          fi
