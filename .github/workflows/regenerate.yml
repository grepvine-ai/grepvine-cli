name: Regenerate the API client

# Grepvine's "Update SDK snapshots" workflow commits a new spec/ snapshot to
# main and then dispatches this workflow with that commit.
on:
  workflow_dispatch:
    inputs:
      snapshot_commit:
        description: Snapshot commit pushed by Grepvine (empty uses current main)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: regenerate
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Check the requested snapshot is still current
        if: inputs.snapshot_commit != ''
        env:
          SNAPSHOT_COMMIT: ${{ inputs.snapshot_commit }}
        run: |
          [[ "$SNAPSHOT_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          git diff --exit-code "$SNAPSHOT_COMMIT" HEAD -- spec

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Regenerate the API client
        run: make generate

      - name: Run linters
        run: make lint

      - name: Run tests with the race detector
        run: make test-race

      - name: Build
        run: make build

      - name: Commit the regenerated client
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add internal/httpapi
          if ! git diff --cached --quiet; then
            source_commit=$(jq -r .commit spec/source.json)
            git commit -m "Generate the API client from Grepvine $source_commit"
            git push origin HEAD:main
          fi
