version: "2"

run:
  timeout: 10m

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - copyloopvar
    - durationcheck
    - errorlint
    - gocritic
    - gosec
    - misspell
    - modernize
    - nilerr
    - noctx
    - nolintlint
    - predeclared
    - revive
    - unconvert
    - usestdlibvars
    - usetesting
    - wastedassign
  settings:
    errorlint:
      # Errors cross the public API boundary; wrapping is a per-site choice.
      errorf: false
    gosec:
      excludes:
        - G104 # duplicate of errcheck
        - G115 # integer conversions are deliberate
        - G301 # directory and file modes are chosen per use; the umask applies
        - G302
        - G306
        - G404 # math/rand is used for jitter, sampling and tests, not secrets
        - G703 # file paths come from the person running the command
    govet:
      enable-all: true
      disable:
        - fieldalignment
        - shadow
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
          arguments:
            - allowTypesBefore: "*testing.T,*testing.B,testing.TB"
        - name: context-keys-type
        - name: dot-imports
        - name: empty-block
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: increment-decrement
        - name: indent-error-flow
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: var-declaration
        - name: var-naming
    misspell:
      locale: US
    usetesting:
      context-background: true
      context-todo: true
      os-setenv: true
    nolintlint:
      require-explanation: true
      require-specific: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gosec
          - noctx

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/grepvine-ai/grepvine-cli
  exclusions:
    generated: lax
