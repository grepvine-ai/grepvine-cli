# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: gv

builds:
  - id: gv
    main: ./cmd/gv
    binary: gv
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.ShortCommit}} -X main.commitTime={{.CommitDate}}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - NOTICE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
