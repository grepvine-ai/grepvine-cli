# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: gv

builds:
  - id: gv
    main: ./cmd/gv
    binary: gv
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.ShortCommit}} -X main.commitTime={{.CommitDate}}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - NOTICE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc

homebrew_casks:
  - name: gv
    repository:
      owner: grepvine-ai
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    homepage: https://github.com/grepvine-ai/grepvine-cli
    description: Command-line client for the Grepvine API
    license: Apache-2.0
    hooks:
      post:
        # The binaries are not notarized, so clear the quarantine flag that
        # would make macOS refuse to run gv.
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/gv"]
          end
